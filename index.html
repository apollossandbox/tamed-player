<title>Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Permanent+Marker&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: flat studio. Solid docked sidebar, hairline-ruled panels, docked player bar. Monochrome; color comes only from cover art. */
:root {
  --bg: #0b0b0c; --panel: #131315; --panel2: #1b1b1e; --panel3: #27272b; --line: rgba(255,255,255,.08);
  --ink: #f4f4f2; --ink2: rgba(244,244,242,.8); --ink3: rgba(244,244,242,.6); --onink: #0b0b0c;
  --g1: var(--panel); --g2: var(--panel); --edge: var(--line); --hi: transparent; --lo: var(--line); --shadow: rgba(0,0,0,.55); --spec: transparent;
  --field: var(--panel2); --hover: var(--panel2); --sel: var(--panel3); --scrim: rgba(0,0,0,.62);
  --blob1: #000; --blob2: #000; --blob3: #000; --blobo: 0;
  --f: Arial, Helvetica, sans-serif; --fd: Arial, Helvetica, sans-serif; --marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --ease: cubic-bezier(.32,1.18,.46,1); --ease2: cubic-bezier(.22,.9,.3,1); --side: 220px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f2ef; --panel: #ffffff; --panel2: #f0f0ed; --panel3: #e3e3df; --line: rgba(0,0,0,.09);
  --ink: #111112; --ink2: rgba(17,17,18,.78); --ink3: rgba(17,17,18,.62); --onink: #ffffff; --shadow: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.3); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f2ef; --panel: #ffffff; --panel2: #f0f0ed; --panel3: #e3e3df; --line: rgba(0,0,0,.09);
  --ink: #111112; --ink2: rgba(17,17,18,.78); --ink3: rgba(17,17,18,.62); --onink: #ffffff; --shadow: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.3); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f); margin: 0; text-wrap: balance; }
.faint { color: var(--ink2); margin: 0; } .small { font-size: 12.5px; } .pad { padding: 6px 10px; }
.mono { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* aurora */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blobo); will-change: transform; }
.b1 { width: 52vw; height: 52vw; left: -12vw; top: -14vw; background: var(--blob1); animation: d1 28s ease-in-out infinite alternate; }
.b2 { width: 44vw; height: 44vw; right: -10vw; top: 22vh; background: var(--blob2); animation: d2 33s ease-in-out infinite alternate; }
.b3 { width: 38vw; height: 38vw; left: 30vw; bottom: -20vw; background: var(--blob3); animation: d3 25s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(8vw, 10vh) scale(1.1); } }
@keyframes d2 { to { transform: translate(-9vw, -8vh) scale(.92); } }
@keyframes d3 { to { transform: translate(-6vw, -12vh) scale(1.15); } }

/* liquid glass */
.glass, .box { position: relative; background: linear-gradient(145deg, var(--g1), var(--g2)); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.05); backdrop-filter: blur(28px) saturate(180%) brightness(1.05);
  box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--lo), inset 0 0 26px rgba(255,255,255,.04), 0 18px 46px -14px var(--shadow); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(90% 60% at 12% -8%, var(--spec), transparent 62%); }
.glass { border-radius: 28px; } .box { border-radius: 16px; box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 8px 24px -12px var(--shadow); }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 16px; padding-top: 16px; padding-bottom: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .4s var(--ease2), transform .5s var(--ease2), filter .4s; }
body.cx-on .app, body.cx-on .bar { opacity: 0; transform: scale(.97); filter: blur(6px); pointer-events: none; }
body.cx-on .bar { transform: translateX(-50%) scale(.97); }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 4px; padding: 16px 8px 10px; margin-bottom: 16px; overflow: hidden; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 16px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.logo { flex: none; filter: drop-shadow(0 0 1px rgba(128,128,128,.6)) drop-shadow(0 4px 10px var(--shadow)); }
.logo .spin { transform-box: view-box; transform-origin: 50% 50%; animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.snav, .cols { position: relative; display: flex; flex-direction: column; gap: 2px; }
.navbtn, .colitem { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; text-align: left; color: var(--ink2); border-radius: 13px; transition: color .25s, background .25s; }
.navbtn span, .colitem .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.colitem .cn { display: flex; flex-direction: column; gap: 1px; } .colitem .cn-t, .colitem .cn-k { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.colitem .cn-k { font-size: 12px; color: var(--ink3); } .colitem { touch-action: pan-x; }
.colitem.dragging { z-index: 5; background: var(--panel3); box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); cursor: grabbing; }
body.side-sorting .colitem:not(.dragging) { transition: transform .22s var(--ease), color .25s, background .25s; } body.side-sorting { cursor: grabbing; user-select: none; }
.navbtn em, .colitem em, .chip em { font-style: normal; font-size: 12px; color: var(--ink3); }
.navbtn:hover, .colitem:hover { color: var(--ink); }
.navbtn:not(.on):hover, .colitem:not(.on):hover { background: var(--hover); }
.navbtn.on, .colitem.on { color: var(--ink); }
.colitem.dropping { outline: 2px dashed var(--ink); outline-offset: -2px; }
.shead { display: flex; align-items: center; justify-content: space-between; padding: 18px 9px 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.colswrap { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; }
.mini { width: 24px; height: 24px; flex: none; border-radius: 7px; background-color: var(--field); }
.sfoot { display: flex; justify-content: flex-start; padding: 8px 2px 0; }
.credbtn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink3); border: 1px solid var(--lo); transition: color .2s, transform .4s var(--ease), border-color .2s; }
.sfoot { gap: 6px; align-items: center; } .sfoot .ver { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.credbtn:hover { color: var(--ink); border-color: var(--edge); transform: rotate(-90deg) scale(1.08); }

/* slider thumb for every segmented control and the nav */
.thumb { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 999px; pointer-events: none; background: var(--sel); box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 4px 12px -4px var(--shadow);
  transition: transform .5s var(--ease), width .5s var(--ease), height .5s var(--ease), opacity .2s; }
.snav .thumb, .cols .thumb { border-radius: 13px; }

.ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--ink2); flex: none; transition: background .2s, color .2s, transform .3s var(--ease); }
.ico:hover { background: var(--hover); color: var(--ink); } .ico:active { transform: scale(.9); } .ico.lit { color: var(--ink); background: var(--sel); }

/* main */
.main { overflow-y: auto; min-width: 0; padding: 12px 6px 140px 0; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
.main.enter > * { animation: rise .55s var(--ease2) both; }
.main.enter > *:nth-child(2) { animation-delay: .04s; } .main.enter > *:nth-child(3) { animation-delay: .08s; } .main.enter > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes rise { from { opacity: .001; transform: translateY(14px); } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.hact { display: flex; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 6px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 17px; font-weight: 700; color: var(--ink); border-radius: 999px; background: linear-gradient(145deg, var(--g1), var(--g2)); border: 1px solid var(--edge); box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 8px 20px -12px var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: transform .35s var(--ease), filter .2s; white-space: nowrap; text-decoration: none; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.18); } .btn:active { transform: scale(.96); transition-duration: .1s; }
.btn.primary { background: var(--ink); color: var(--onink); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -10px var(--shadow); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; } .btn:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
.btn.armed { background: var(--ink); color: var(--onink); }

.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.search, .sel { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 40px; }
.search { flex: 1 1 220px; max-width: 340px; } .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; height: 100%; }
.search:focus-within, .field:focus { box-shadow: 0 0 0 2px var(--ink); }
.sel select { background: none; border: 0; outline: 0; padding: 8px 0; cursor: pointer; min-width: 0; flex: 1; } .sel select option { color: #000; background: #fff; } .sel.wide { width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.chip { padding: 7px 13px; border-radius: 999px; color: var(--ink2); background: var(--field); border: 1px solid transparent; font-weight: 700; transition: all .25s; }
.chip:hover { color: var(--ink); } .chip.on { color: var(--ink); background: var(--sel); border-color: var(--edge); box-shadow: inset 0 1px 0 var(--hi); }

.seg { position: relative; display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--field); border: 1px solid var(--lo); }
.seg > button { position: relative; z-index: 1; padding: 6px 14px; border-radius: 999px; color: var(--ink2); font-weight: 700; font-size: 13px; transition: color .3s; white-space: nowrap; }
.seg > button:hover, .seg > button.on { color: var(--ink); }
.seg.full { display: flex; } .seg.full > button { flex: 1; }

/* pop-out picker: one button, options slide out to its right */
.pick { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; flex-wrap: nowrap; }
.pick-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 14px; border-radius: 999px; background: var(--sel); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi); font-weight: 700; font-size: 13px; transition: transform .35s var(--ease); flex: none; }
.pick-btn small { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.pick-btn .ic { transition: transform .45s var(--ease); }
.pick.open .pick-btn .ic { transform: rotate(180deg); }
.pick-opts { display: flex; gap: 4px; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .55s var(--ease2), opacity .3s; padding: 2px; }
.pick.open .pick-opts { max-width: 420px; opacity: 1; }
.pick-opts button { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink2); background: var(--field); border: 1px solid var(--lo); opacity: 0; transform: translateX(-14px) scale(.9);
  transition: transform .45s var(--ease) calc(var(--i) * 45ms), opacity .3s calc(var(--i) * 45ms), background .2s, color .2s; }
.pick.open .pick-opts button { opacity: 1; transform: none; }
.pick-opts button:hover { color: var(--ink); background: var(--hover); } .pick-opts button.on { color: var(--onink); background: var(--ink); }

/* track rows */
.row[data-row="col"] .c-add { font-size: 12px; color: var(--ink3); text-align: center; white-space: nowrap; overflow: hidden; }
.colhead, .row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 128px 104px 64px 50px 36px; gap: 12px; align-items: center; }
.row .c-add { font-size: 12px; color: var(--ink3); text-align: left; white-space: nowrap; overflow: hidden; }
.row .hov { overflow: hidden; text-overflow: ellipsis; text-align: right; opacity: 0; transform: translateX(6px); transition: opacity .2s, transform .3s var(--ease); white-space: nowrap; }
.row:hover .hov, .row:focus-within .hov { opacity: 1; transform: none; }
.row { cursor: pointer; }
.colhead { padding: 6px 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.list { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row { padding: 7px 12px; border-radius: 18px; border: 1px solid transparent; transition: background .25s, border-color .25s, box-shadow .25s; }
.row:hover { background: var(--hover); border-color: var(--lo); }
.row.playing { background: linear-gradient(145deg, var(--g1), var(--g2)); border-color: var(--edge); box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo); }
.row.sel { background: var(--panel3); }
.row.dragging { opacity: .35; } .row.over { box-shadow: 0 0 0 2px var(--ink); background: var(--hover); }
.row[draggable="true"] { cursor: grab; }
.rowplay { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--field); color: var(--ink); transition: background .2s, color .2s, transform .3s var(--ease); }
.rowplay .num { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.rowplay .ic { display: none; } .rowplay.nonum .ic, .row:hover .rowplay .ic, .row.playing .rowplay .ic { display: block; } .row:hover .rowplay .num, .row.playing .rowplay .num { display: none; }
.row:hover .rowplay, .row.playing .rowplay { background: var(--ink); color: var(--onink); } .rowplay:active { transform: scale(.88); }
.cov { width: 44px; height: 44px; border-radius: 12px; flex: none; position: relative; background-color: var(--field); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 10px -4px var(--shadow); }
.cov.ghost { background: var(--field); box-shadow: none; }
.meta { display: flex; flex-direction: column; min-width: 0; }
.meta b, .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .meta b { font-weight: 700; } .meta span { font-size: 12.5px; color: var(--ink2); }
.vtag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 700; border: 1px solid var(--edge); color: var(--ink2); vertical-align: 1px; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; padding: 4px 9px 4px 7px; border-radius: 99px; transition: background .2s, color .2s, transform .3s var(--ease); }
button.pill:hover { background: var(--hover); color: var(--ink); } button.pill:active { transform: scale(.94); }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; background: var(--fill); transition: background .3s; }
.st-demo { --fill: transparent; } .st-unmixed { --fill: conic-gradient(currentColor 0 50%, transparent 0); } .st-final { --fill: currentColor; }
.acts { display: flex; justify-content: flex-end; } .c-dur { text-align: right; }
.empty { padding: 56px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px dashed var(--edge); border-radius: 24px; margin-top: 8px; } .empty p { margin: 0; max-width: 46ch; } .empty .crow { justify-content: center; margin-top: 14px; }

/* library grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 44px 34px; padding: 18px 6px 10px; }
.pcard { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; animation: pop .6s var(--ease) both; animation-delay: calc(var(--n) * 40ms); }
@keyframes pop { from { opacity: .001; transform: translateY(18px) scale(.96); } }
.pc-open { display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0; }
.pc-ring { position: relative; display: block; padding: 2.5px; border-radius: 24px; background: var(--g); box-shadow: 0 0 34px -10px var(--glow), 0 18px 40px -22px var(--shadow); transition: transform .5s var(--ease), box-shadow .4s; }
.pc-art { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 21.5px; background-color: var(--field); }
.pcard:hover .pc-ring { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 0 54px -6px var(--glow), 0 28px 50px -22px var(--shadow); }
.pc-txt { display: flex; flex-direction: column; gap: 3px; padding: 0 4px; min-width: 0; }
.pc-txt b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pc-txt span { font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-play { position: absolute; right: 12px; top: calc((100% - 56px) - 52px); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--onink); opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .3s, transform .45s var(--ease); box-shadow: 0 8px 20px -6px var(--shadow); }
.pcard:hover .pc-play, .pc-play:focus-visible { opacity: 1; transform: none; }
.pc-new .pc-ring { background: var(--edge); } .pc-new .pc-art { display: grid; place-items: center; color: var(--ink2); background: var(--field); }

/* project page */
.chero { display: flex; gap: 28px; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; }
.covwrap { position: relative; width: min(240px, 100%); flex: none; }
.bigcov { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 26px; background-color: var(--field); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 24px 50px -20px var(--shadow); transition: transform .6s var(--ease); }
.covwrap.beat .bigcov { transform: scale(var(--beat, 1)); transition: transform .08s linear; }
.viz { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; pointer-events: none; }
.cinfo { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.trow { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title-in { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-weight: 700; letter-spacing: -.02em; font-size: clamp(28px, 4vw, 42px); line-height: 1.1; padding: 0; border-radius: 8px; }
.title-in:focus, .desc-in:focus { box-shadow: 0 0 0 2px var(--ink); }
.desc-in { background: none; border: 0; outline: 0; resize: none; color: var(--ink2); padding: 0; width: 100%; max-width: 60ch; border-radius: 8px; }
.stat { margin: 0; display: flex; gap: 14px; flex-wrap: wrap; font-weight: 700; font-size: 13.5px; }
.stat span { display: inline-flex; align-items: center; gap: 7px; } .stat .pill { padding: 0; font-weight: 700; color: var(--ink); }
.crow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 99px; background: var(--field); border: 1px solid var(--lo); font-size: 12.5px; font-weight: 700; animation: pop .4s var(--ease) both; }
.tag .ico { width: 20px; height: 20px; } .tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tag-in { width: 130px; padding: 5px 11px; border-radius: 99px; background: transparent; border: 1px dashed var(--edge); outline: 0; font-size: 12.5px; }
.tag-in:focus { border-style: solid; }
.covers { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cthumb { position: relative; width: 38px; height: 38px; border-radius: 10px; background-color: var(--field); border: 2px solid transparent; transition: transform .35s var(--ease), border-color .2s; }
.cthumb:hover { transform: translateY(-3px); } .cthumb.on { border-color: var(--ink); }
.cthumb.add { display: grid; place-items: center; border: 1px dashed var(--edge); color: var(--ink2); }
.ctools { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.lab { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }

/* popovers */
.pop { position: absolute; z-index: 25; padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; min-width: 280px; max-width: min(380px, calc(100vw - 32px));
  opacity: 0; transform: translateY(-6px) scale(.96); transform-origin: top left; pointer-events: none; visibility: hidden; transition: opacity .25s, transform .4s var(--ease), visibility 0s .4s;
  -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }

const FL = { access: null, pong: 0, tried: false, err: '', status: null, msg: '' };
// The FL Studio plugin (a MIDI controller script). The Windows build also writes this to desktop/fl/device_Compass.py.
const FL_SCRIPT = `# name=Compass
# url=https://github.com/apollossandbox/tamed-player
# supportedDevices=Tamed Link
"""
Compass link for FL Studio.

Compass's Audio Doctor sends a short MIDI message through a virtual MIDI
port (for example a loopMIDI port called "Tamed Link"). This script reads it
and sets the project tempo, rewinds to bar 1 and opens the playlist, so the WAV
you drag in from Compass lands on the grid.

Messages (SysEx, manufacturer 0x7D, then "TP"):
  F0 7D 54 50 01 b0 b1 b2 b3 F7   set tempo, value = BPM x 1000 in four 7-bit bytes
  F0 7D 54 50 02 F7               ping, answered with F0 7D 54 50 03 F7 when an output port is linked
  F0 7D 54 50 05 F7               rewind to bar 1 and show the playlist
"""
import midi
import general
import transport
import ui
import device

HEAD = (0xF0, 0x7D, 0x54, 0x50)


def OnInit():
    print("Compass link is ready")


def _hint(text):
    try:
        ui.setHintMsg(text)
    except Exception:
        pass


def OnSysEx(event):
    data = event.sysex
    if not data or len(data) < 6 or tuple(data[:4]) != HEAD:
        return
    event.handled = True
    cmd = data[4]
    body = data[5:-1]
    if cmd == 0x01 and len(body) >= 4:
        milli = (body[0] << 21) | (body[1] << 14) | (body[2] << 7) | body[3]
        bpm = milli / 1000.0
        if 10.0 <= bpm <= 522.0:
            general.processRECEvent(midi.REC_Tempo, milli, midi.REC_Control | midi.REC_UpdateControl)
            _hint("Compass: tempo set to %g BPM" % bpm)
    elif cmd == 0x02:
        try:
            device.midiOutSysex(bytes(HEAD + (0x03, 0xF7)))
        except Exception:
            pass
        _hint("Compass is connected")
    elif cmd == 0x05:
        try:
            if transport.isPlaying():
                transport.stop()
            transport.setSongPos(0)
            ui.showWindow(midi.widPlaylist)
            ui.setFocused(midi.widPlaylist)
        except Exception:
            pass
`;

==================================

What it does
Compass's Audio Doctor uses it to set FL Studio's tempo to your song, rewind to bar 1 and open the playlist,
so the beat-aligned WAV you drag in from Compass sits on the grid.

Install
1. Unzip this file. You get a folder called "Compass".
2. Move that folder into FL Studio's hardware scripts folder:
     Windows: Documents\Image-Line\FL Studio\Settings\Hardware
     Mac:     Documents/Image-Line/FL Studio/Settings/Hardware
   (FL Studio shows its user data folder under Options > File settings.)

4. Open FL Studio > Options > MIDI settings. Under Input, pick "Tamed Link", set Controller type to "Compass" and enable it.
   To let Compass's Test button get an answer, also pick the same port under Output and give both the same Port number.
5. In Compass: Audio Doctor > Send to FL Studio > Set up > pick the port > Test.

Made by sxteen ways, trulytamed and all of KGB.

async function backupAll() {
  if (!window.JSZip) return toast('Zip support did not load, so backups are unavailable');
  let dl = null; try { dl = await claude.use('downloads'); } catch (e) { } if (!dl) return toast('Saving files is not available in this view');
  toast('Packing your backup…');
  const z = new JSZip(), keys = new Set();
  S.tracks.forEach(t => { keys.add(t.id); (t.versions || []).forEach(v => keys.add(v.id)); });
  S.cols.forEach(c => (c.covers || []).forEach(cv => keys.add('art:' + cv.id)));
  S.cols.forEach(c => { if (c.logo) keys.add(c.logo); });
  Object.values(S.cd.designs || {}).forEach(d => Object.values(d).forEach(sd => (sd.layers || []).forEach(l => { if (l.src && l.src.startsWith('cdimg:')) keys.add(l.src); })));
  (S.cd.fonts || []).forEach(f => keys.add('cdfont:' + f.id));
  const files = {}; let i = 0;
  for (const k of keys) { const b = await DB.get(k); if (b) { const n = 'files/' + (++i) + '-' + k.replace(/[^\w.-]+/g, '_'); z.file(n, b); files[k] = { n, type: b.type || '' }; } }
  z.file('tamed-player-backup.json', JSON.stringify({ app: 'Compass', kind: 'backup', format: 1, date: new Date().toISOString(), state: { ...S, playing: false, q: '', editId: null, cx: { ...S.cx, open: false } }, files }));
  const blob = await z.generateAsync({ type: 'blob' });
  try { await dl.save({ filename: `compass-backup-${today()}.zip`, data: blob }); toast('Backup ready'); } catch (e) { if (e && e.code === 'too_large') toast('The backup is too large to save here'); else if (e && e.code !== 'declined') toast('The backup could not be saved'); }
}
async function restoreAll(file) {
  if (!window.JSZip) return toast('Zip support did not load, so backups are unavailable');
  try {
    const z = await JSZip.loadAsync(file), j = z.file('tamed-player-backup.json');
    if (!j) return toast('That zip is not a Compass backup. To import music, drop it in the Library.');
    const meta = JSON.parse(await j.async('string')); toast('Restoring…');
    for (const [k, f] of Object.entries(meta.files || {})) { const e = z.file(f.n); if (e) { const b = await e.async('blob'); await DB.put(k, f.type ? new Blob([b], { type: f.type }) : b); } }
    localStorage.setItem(KEY, JSON.stringify(meta.state)); location.reload();
  } catch (e) { toast('That backup could not be read'); }
}

function onContext(e) {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  const t = e.target; let menu = null;
  if (t.id === 'cd2d') {
    const r = t.getBoundingClientRect(), p = UI.p2d, key = S.cd.sheet, mx = (e.clientX - r.left) / p - BLEED, my = (e.clientY - r.top) / p - BLEED;
    if (S.cd.lock) menu = viewOnlyMenu(); else { const L = hitLayer(design(cdCol())[key], mx, my); if (L) { UI.cdSel = { sheet: key, id: L.id }; renderCdPanel(); draw2D(); menu = layerMenu(L); } else menu = panelMenu(key, { x: mx, y: my }); }
  } else if (t.classList && t.classList.contains('cd3d') && !UI.vw) {
    if (S.cd.lock) menu = viewOnlyMenu(); else { const h = pick(e); if (h) { const L = hitLayer(design(cdCol())[h.sheet], h.x, h.y); S.cd.sheet = h.sheet; UI.cdSel = { sheet: h.sheet, id: L ? L.id : null }; renderCdPanel(); menu = L ? layerMenu(L) : panelMenu(h.sheet, h); } else menu = panelMenu(S.cd.sheet); }
  } else if (t.closest('[data-psl]')) {
    const f = findLayer(t.closest('[data-psl]').dataset.psl); if (f) { S.cd.sheet = f.sheet; UI.cdSel = { sheet: f.sheet, id: f.L.id }; renderCdPanel(); cdDirty(); menu = layerMenu(f.L); }
  } else if (t.closest('.psg-h, .psbg')) { const k = (t.closest('.psg-h') || t.closest('.psbg').querySelector('[data-k]')).dataset.k; menu = panelMenu(k); }
  else if (t.closest('.ps-canvas, .ps-scroll')) menu = S.cd.lock ? viewOnlyMenu() : panelMenu(S.cd.sheet);
  else if (t.closest('#list .row')) { const r = t.closest('.row'), tr = trk(r.dataset.id); if (UI.sel.size > 1 && UI.sel.has(r.dataset.id)) menu = bulkMenu([...UI.sel].filter(trk)); else if (tr) { if (!UI.sel.has(tr.id)) selectRow(tr.id, {}); menu = trackMenu(tr, r.dataset.row === 'col'); } }
  else if (t.closest('.chero') && S.view === 'collection') { const c = col(S.colId); if (c) menu = projectMenu(c); }
  else if (t.closest('.cdcard')) { const id = t.closest('.cdcard').dataset.id, c = col(id); if (c) menu = [{ head: c.name }, { label: 'Play CD', act: 'cdp-play', id, icon: 'play' }, { label: 'View Only', act: 'cdp-view', id, icon: 'cube' }, { sep: 1 }, { label: 'Edit CD', act: 'ctx-editcd', id, icon: 'edit' }, { label: 'Open Project', act: 'col', id, icon: 'grid' }]; }
  else if (t.closest('.acard:not(.acard-new), .colitem, .lcard')) { const n = t.closest('.acard, .colitem, .lcard'), id = (n.dataset.id || (n.querySelector('[data-id]') || {}).dataset?.id); const c = col(id); if (c) menu = projectMenu(c); }
  if (!menu) return;
  e.preventDefault(); ctxMenu(e.clientX, e.clientY, menu);
}

/* ---------- boot ---------- */
(async function boot() {
  load();
  for (const t of S.tracks) { if (t.file) { const b = await DB.get(t.id); if (b) srcs[t.id] = URL.createObjectURL(b); else t.file = false; } for (const v of t.versions) { const b = await DB.get(v.id); if (b) srcs[v.id] = URL.createObjectURL(b); } if (t.ver !== t.id && !srcs[t.ver]) t.ver = t.id; }
  for (const c of S.cols) if (c.logo) { const b = await DB.get(c.logo); if (b) srcs[c.logo] = URL.createObjectURL(b); }
  for (const c of S.cols) for (const cv of c.covers) { const b = await DB.get('art:' + cv.id); if (b) { srcs['art:' + cv.id] = URL.createObjectURL(b); if (!cv.colors) cv.colors = await extractColors(srcs['art:' + cv.id]); } }
  await loadCustomFonts();
  for (const [n, a] of Object.entries(S.artists || {})) for (const k of ['pic', 'bg']) if (a[k]) { const b = await DB.get('artist:' + k + ':' + n); if (b) srcs['artist:' + k + ':' + n] = URL.createObjectURL(b); }
  for (const dd of Object.values(S.cd.designs || {})) for (const sd of Object.values(dd)) for (const l of (sd.layers || [])) if (l.src && l.src.startsWith('cdimg:') && !srcs[l.src]) { const b = await DB.get(l.src); if (b) srcs[l.src] = URL.createObjectURL(b); }
  S.cols.forEach(c => { c.covers = c.covers.filter(cv => srcs['art:' + cv.id]); if (!c.covers.some(cv => cv.id === c.cover)) c.cover = c.covers.length ? c.covers[0].id : null; });
  if (S.cur && !trk(S.cur)) S.cur = null;
  if (S.cur) Engine.load(trk(S.cur));
  if (S.view === 'collection' && !col(S.colId)) S.view = 'library';
  applyPrefs(); refresh(); renderEq();
  setInterval(tick, 250);
  setTimeout(checkWhatsNew, 1200);
  setTimeout(async () => { let n = 0; for (const t of S.tracks) { if (t.size) continue; const b = await DB.get(keyOf(t)); if (b) { t.size = b.size; n++; } } if (n) save(); }, 3000);
})();
