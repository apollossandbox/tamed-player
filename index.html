<title>Tamed Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Permanent+Marker&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: flat studio. Solid docked sidebar, hairline-ruled panels, docked player bar. Monochrome; color comes only from cover art. */
:root {
  --bg: #0b0b0c; --panel: #131315; --panel2: #1b1b1e; --panel3: #27272b; --line: rgba(255,255,255,.08);
  --ink: #f4f4f2; --ink2: rgba(244,244,242,.62); --ink3: rgba(244,244,242,.38); --onink: #0b0b0c;
  --g1: var(--panel); --g2: var(--panel); --edge: var(--line); --hi: transparent; --lo: var(--line); --shadow: rgba(0,0,0,.55); --spec: transparent;
  --field: var(--panel2); --hover: var(--panel2); --sel: var(--panel3); --scrim: rgba(0,0,0,.62);
  --blob1: #000; --blob2: #000; --blob3: #000; --blobo: 0;
  --f: "Archivo", Arial, Helvetica, sans-serif; --fd: "Archivo", Arial, Helvetica, sans-serif; --marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --ease: cubic-bezier(.32,1.18,.46,1); --ease2: cubic-bezier(.22,.9,.3,1); --side: 220px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f2ef; --panel: #ffffff; --panel2: #f0f0ed; --panel3: #e3e3df; --line: rgba(0,0,0,.09);
  --ink: #111112; --ink2: rgba(17,17,18,.62); --ink3: rgba(17,17,18,.4); --onink: #ffffff; --shadow: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.3); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f2ef; --panel: #ffffff; --panel2: #f0f0ed; --panel3: #e3e3df; --line: rgba(0,0,0,.09);
  --ink: #111112; --ink2: rgba(17,17,18,.62); --ink3: rgba(17,17,18,.4); --onink: #ffffff; --shadow: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.3); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.4; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f); margin: 0; text-wrap: balance; }
.faint { color: var(--ink2); margin: 0; } .small { font-size: 12px; } .pad { padding: 6px 10px; }
.mono { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.ic { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* aurora */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blobo); will-change: transform; }
.b1 { width: 52vw; height: 52vw; left: -12vw; top: -14vw; background: var(--blob1); animation: d1 28s ease-in-out infinite alternate; }
.b2 { width: 44vw; height: 44vw; right: -10vw; top: 22vh; background: var(--blob2); animation: d2 33s ease-in-out infinite alternate; }
.b3 { width: 38vw; height: 38vw; left: 30vw; bottom: -20vw; background: var(--blob3); animation: d3 25s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(8vw, 10vh) scale(1.1); } }
@keyframes d2 { to { transform: translate(-9vw, -8vh) scale(.92); } }
@keyframes d3 { to { transform: translate(-6vw, -12vh) scale(1.15); } }

/* liquid glass */
.glass, .box { position: relative; background: linear-gradient(145deg, var(--g1), var(--g2)); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(28px) saturate(180%) brightness(1.05); backdrop-filter: blur(28px) saturate(180%) brightness(1.05);
  box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--lo), inset 0 0 26px rgba(255,255,255,.04), 0 18px 46px -14px var(--shadow); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(90% 60% at 12% -8%, var(--spec), transparent 62%); }
.glass { border-radius: 28px; } .box { border-radius: 16px; box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 8px 24px -12px var(--shadow); }

.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 16px; padding-top: 16px; padding-bottom: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .4s var(--ease2), transform .5s var(--ease2), filter .4s; }
body.cx-on .app, body.cx-on .bar { opacity: 0; transform: scale(.97); filter: blur(6px); pointer-events: none; }
body.cx-on .bar { transform: translateX(-50%) scale(.97); }

/* sidebar */
.side { display: flex; flex-direction: column; gap: 4px; padding: 16px 8px 10px; margin-bottom: 16px; overflow: hidden; min-height: 0; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 16px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.logo { flex: none; filter: drop-shadow(0 0 1px rgba(128,128,128,.6)) drop-shadow(0 4px 10px var(--shadow)); }
.logo .spin { transform-box: view-box; transform-origin: 50% 50%; animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.snav, .cols { position: relative; display: flex; flex-direction: column; gap: 2px; }
.navbtn, .colitem { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; text-align: left; color: var(--ink2); border-radius: 13px; transition: color .25s, background .25s; }
.navbtn span, .colitem .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbtn em, .colitem em, .chip em { font-style: normal; font-size: 11px; color: var(--ink3); }
.navbtn:hover, .colitem:hover { color: var(--ink); }
.navbtn:not(.on):hover, .colitem:not(.on):hover { background: var(--hover); }
.navbtn.on, .colitem.on { color: var(--ink); }
.colitem.dropping { outline: 2px dashed var(--ink); outline-offset: -2px; }
.shead { display: flex; align-items: center; justify-content: space-between; padding: 18px 9px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.colswrap { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: none; }
.mini { width: 24px; height: 24px; flex: none; border-radius: 7px; background-color: var(--field); }
.sfoot { display: flex; justify-content: flex-start; padding: 8px 2px 0; }
.credbtn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink3); border: 1px solid var(--lo); transition: color .2s, transform .4s var(--ease), border-color .2s; }
.sfoot { gap: 6px; align-items: center; } .sfoot .ver { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.credbtn:hover { color: var(--ink); border-color: var(--edge); transform: rotate(-90deg) scale(1.08); }

/* slider thumb for every segmented control and the nav */
.thumb { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 999px; pointer-events: none; background: var(--sel); box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 4px 12px -4px var(--shadow);
  transition: transform .5s var(--ease), width .5s var(--ease), height .5s var(--ease), opacity .2s; }
.snav .thumb, .cols .thumb { border-radius: 13px; }

.ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--ink2); flex: none; transition: background .2s, color .2s, transform .3s var(--ease); }
.ico:hover { background: var(--hover); color: var(--ink); } .ico:active { transform: scale(.9); } .ico.lit { color: var(--ink); background: var(--sel); }

/* main */
.main { overflow-y: auto; min-width: 0; padding: 12px 6px 140px 0; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
.main.enter > * { animation: rise .55s var(--ease2) both; }
.main.enter > *:nth-child(2) { animation-delay: .04s; } .main.enter > *:nth-child(3) { animation-delay: .08s; } .main.enter > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes rise { from { opacity: .001; transform: translateY(14px); } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.hact { display: flex; gap: 8px; flex-wrap: wrap; }
h1 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 6px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 17px; font-weight: 700; color: var(--ink); border-radius: 999px; background: linear-gradient(145deg, var(--g1), var(--g2)); border: 1px solid var(--edge); box-shadow: inset 0 1.5px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 8px 20px -12px var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: transform .35s var(--ease), filter .2s; white-space: nowrap; text-decoration: none; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.18); } .btn:active { transform: scale(.96); transition-duration: .1s; }
.btn.primary { background: var(--ink); color: var(--onink); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px -10px var(--shadow); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; } .btn:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
.btn.armed { background: var(--ink); color: var(--onink); }

.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.search, .sel { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 40px; }
.search { flex: 1 1 220px; max-width: 340px; } .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; height: 100%; }
.search:focus-within, .field:focus { box-shadow: 0 0 0 2px var(--ink); }
.sel select { background: none; border: 0; outline: 0; padding: 8px 0; cursor: pointer; min-width: 0; flex: 1; } .sel select option { color: #000; background: #fff; } .sel.wide { width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.chip { padding: 7px 13px; border-radius: 999px; color: var(--ink2); background: var(--field); border: 1px solid transparent; font-weight: 700; transition: all .25s; }
.chip:hover { color: var(--ink); } .chip.on { color: var(--ink); background: var(--sel); border-color: var(--edge); box-shadow: inset 0 1px 0 var(--hi); }

.seg { position: relative; display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--field); border: 1px solid var(--lo); }
.seg > button { position: relative; z-index: 1; padding: 6px 14px; border-radius: 999px; color: var(--ink2); font-weight: 700; font-size: 13px; transition: color .3s; white-space: nowrap; }
.seg > button:hover, .seg > button.on { color: var(--ink); }
.seg.full { display: flex; } .seg.full > button { flex: 1; }

/* pop-out picker: one button, options slide out to its right */
.pick { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; flex-wrap: nowrap; }
.pick-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 14px; border-radius: 999px; background: var(--sel); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi); font-weight: 700; font-size: 13px; transition: transform .35s var(--ease); flex: none; }
.pick-btn small { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.pick-btn .ic { transition: transform .45s var(--ease); }
.pick.open .pick-btn .ic { transform: rotate(180deg); }
.pick-opts { display: flex; gap: 4px; max-width: 0; overflow: hidden; opacity: 0; transition: max-width .55s var(--ease2), opacity .3s; padding: 2px; }
.pick.open .pick-opts { max-width: 420px; opacity: 1; }
.pick-opts button { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink2); background: var(--field); border: 1px solid var(--lo); opacity: 0; transform: translateX(-14px) scale(.9);
  transition: transform .45s var(--ease) calc(var(--i) * 45ms), opacity .3s calc(var(--i) * 45ms), background .2s, color .2s; }
.pick.open .pick-opts button { opacity: 1; transform: none; }
.pick-opts button:hover { color: var(--ink); background: var(--hover); } .pick-opts button.on { color: var(--onink); background: var(--ink); }

/* track rows */
.colhead, .row { display: grid; grid-template-columns: 36px 44px minmax(0, 1fr) 100px 76px 54px 50px 70px; gap: 12px; align-items: center; }
.colhead { padding: 6px 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.list { position: relative; display: flex; flex-direction: column; gap: 4px; }
.row { padding: 7px 12px; border-radius: 18px; border: 1px solid transparent; transition: background .25s, border-color .25s, box-shadow .25s; }
.row:hover { background: var(--hover); border-color: var(--lo); }
.row.playing { background: linear-gradient(145deg, var(--g1), var(--g2)); border-color: var(--edge); box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo); }
.row.dragging { opacity: .35; } .row.over { box-shadow: 0 0 0 2px var(--ink); background: var(--hover); }
.row[draggable="true"] { cursor: grab; }
.rowplay { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--field); color: var(--ink); transition: background .2s, color .2s, transform .3s var(--ease); }
.rowplay .num { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.rowplay .ic { display: none; } .rowplay.nonum .ic, .row:hover .rowplay .ic, .row.playing .rowplay .ic { display: block; } .row:hover .rowplay .num, .row.playing .rowplay .num { display: none; }
.row:hover .rowplay, .row.playing .rowplay { background: var(--ink); color: var(--onink); } .rowplay:active { transform: scale(.88); }
.cov { width: 44px; height: 44px; border-radius: 12px; flex: none; position: relative; background-color: var(--field); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 10px -4px var(--shadow); }
.cov.ghost { background: var(--field); box-shadow: none; }
.meta { display: flex; flex-direction: column; min-width: 0; }
.meta b, .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .meta b { font-weight: 700; } .meta span { font-size: 12.5px; color: var(--ink2); }
.vtag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--edge); color: var(--ink2); vertical-align: 1px; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; padding: 4px 9px 4px 7px; border-radius: 99px; transition: background .2s, color .2s, transform .3s var(--ease); }
button.pill:hover { background: var(--hover); color: var(--ink); } button.pill:active { transform: scale(.94); }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; background: var(--fill); transition: background .3s; }
.st-demo { --fill: transparent; } .st-unmixed { --fill: conic-gradient(currentColor 0 50%, transparent 0); } .st-final { --fill: currentColor; }
.acts { display: flex; justify-content: flex-end; } .c-dur { text-align: right; }
.empty { padding: 56px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px dashed var(--edge); border-radius: 24px; margin-top: 8px; } .empty p { margin: 0; max-width: 46ch; } .empty .crow { justify-content: center; margin-top: 14px; }

/* library grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 44px 34px; padding: 18px 6px 10px; }
.pcard { position: relative; display: flex; flex-direction: column; gap: 12px; min-width: 0; animation: pop .6s var(--ease) both; animation-delay: calc(var(--n) * 40ms); }
@keyframes pop { from { opacity: .001; transform: translateY(18px) scale(.96); } }
.pc-open { display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0; }
.pc-ring { position: relative; display: block; padding: 2.5px; border-radius: 24px; background: var(--g); box-shadow: 0 0 34px -10px var(--glow), 0 18px 40px -22px var(--shadow); transition: transform .5s var(--ease), box-shadow .4s; }
.pc-art { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 21.5px; background-color: var(--field); }
.pcard:hover .pc-ring { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 0 54px -6px var(--glow), 0 28px 50px -22px var(--shadow); }
.pc-txt { display: flex; flex-direction: column; gap: 3px; padding: 0 4px; min-width: 0; }
.pc-txt b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pc-txt span { font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-play { position: absolute; right: 12px; top: calc((100% - 56px) - 52px); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--onink); opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .3s, transform .45s var(--ease); box-shadow: 0 8px 20px -6px var(--shadow); }
.pcard:hover .pc-play, .pc-play:focus-visible { opacity: 1; transform: none; }
.pc-new .pc-ring { background: var(--edge); } .pc-new .pc-art { display: grid; place-items: center; color: var(--ink2); background: var(--field); }

/* project page */
.chero { display: flex; gap: 28px; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; }
.covwrap { position: relative; width: min(240px, 100%); flex: none; }
.bigcov { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 26px; background-color: var(--field); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 24px 50px -20px var(--shadow); transition: transform .6s var(--ease); }
.covwrap.beat .bigcov { transform: scale(var(--beat, 1)); transition: transform .08s linear; }
.viz { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; pointer-events: none; }
.cinfo { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.trow { position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; }
.title-in { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-weight: 700; letter-spacing: -.02em; font-size: clamp(28px, 4vw, 42px); line-height: 1.1; padding: 0; border-radius: 8px; }
.title-in:focus, .desc-in:focus { box-shadow: 0 0 0 2px var(--ink); }
.desc-in { background: none; border: 0; outline: 0; resize: none; color: var(--ink2); padding: 0; width: 100%; max-width: 60ch; border-radius: 8px; }
.stat { margin: 0; display: flex; gap: 14px; flex-wrap: wrap; font-weight: 700; font-size: 13.5px; }
.stat span { display: inline-flex; align-items: center; gap: 7px; } .stat .pill { padding: 0; font-weight: 700; color: var(--ink); }
.crow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 99px; background: var(--field); border: 1px solid var(--lo); font-size: 12.5px; font-weight: 700; animation: pop .4s var(--ease) both; }
.tag .ico { width: 20px; height: 20px; } .tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tag-in { width: 130px; padding: 5px 11px; border-radius: 99px; background: transparent; border: 1px dashed var(--edge); outline: 0; font-size: 12.5px; }
.tag-in:focus { border-style: solid; }
.covers { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cthumb { position: relative; width: 38px; height: 38px; border-radius: 10px; background-color: var(--field); border: 2px solid transparent; transition: transform .35s var(--ease), border-color .2s; }
.cthumb:hover { transform: translateY(-3px); } .cthumb.on { border-color: var(--ink); }
.cthumb.add { display: grid; place-items: center; border: 1px dashed var(--edge); color: var(--ink2); }
.ctools { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.lab { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }

/* popovers */
.pop { position: absolute; z-index: 25; padding: 14px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; min-width: 280px; max-width: min(380px, calc(100vw - 32px));
  opacity: 0; transform: translateY(-6px) scale(.96); transform-origin: top left; pointer-events: none; visibility: hidden; transition: opacity .25s, transform .4s var(--ease), visibility 0s .4s;
  -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }
.pop.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity .25s, transform .45s var(--ease), visibility 0s; }
.share-pop { top: calc(100% + 8px); right: 0; transform-origin: top right; }
.link { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; } .link.off { opacity: .55; }
.link code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f); font-size: 12.5px; }

/* drawer */
.drawer { position: fixed; z-index: 30; top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; width: min(390px, calc(100% - 32px)); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; border-radius: 28px;
  -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
  transform: translateX(calc(100% + 40px)); opacity: 0; visibility: hidden; transition: transform .55s var(--ease2), opacity .3s, visibility 0s .55s; }
.drawer.open { transform: none; opacity: 1; visibility: visible; transition: transform .6s var(--ease), opacity .3s, visibility 0s; }
.dh { display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700; }

/* EQ */

  opacity: 0; transform: translateY(14px) scale(.96); transform-origin: bottom right; visibility: hidden; pointer-events: none; transition: opacity .25s, transform .45s var(--ease), visibility 0s .45s; -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }

.eqbands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; justify-items: center; }

/* modal */

.scrim.open { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
.modal { position: fixed; z-index: 29; left: 50%; top: 50%; width: min(460px, calc(100% - 32px)); max-height: calc(100% - 40px); overflow-y: auto; padding: 22px; border-radius: 30px; display: flex; flex-direction: column; gap: 8px;
  transform: translate(-50%, -46%) scale(.95); opacity: 0; visibility: hidden; transition: opacity .25s, transform .45s var(--ease), visibility 0s .45s; -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }

.cd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }

/* ================= concept takeover ================= */

/* ===== Flat studio theme: solid panels, hairline rules, docked sidebar and player. Overrides the old glass look. ===== */
.bg { display: none; }
body { background: var(--bg); font-family: var(--f); letter-spacing: -.003em; }
h1, h2, h3, .brand, .title-in { font-family: var(--fd); font-stretch: 112%; }
h1 { font-weight: 800; font-size: 34px; letter-spacing: -.02em; }
.glass, .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.glass::before { display: none; }

.side { margin: 0; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--panel); padding: 20px 10px 12px; }
.brand { font-size: 15px; font-weight: 800; letter-spacing: .02em; padding: 0 8px 22px; gap: 10px; }
.navbtn, .colitem { border-radius: 8px; padding: 8px 10px; }
.navbtn:not(.on):hover, .colitem:not(.on):hover { background: var(--panel2); }
.thumb { background: var(--panel3); box-shadow: none; border-radius: 8px; }
.snav .thumb, .cols .thumb { border-radius: 8px; }
.shead { padding: 22px 10px 8px; }
.credbtn { border-color: var(--line); }
.main { padding: 30px max(32px, env(safe-area-inset-right, 0px)) 130px 32px; }
.head { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.btn { border-radius: 10px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--panel2); border: 1px solid var(--line); padding: 9px 16px; transition: background .2s, transform .3s var(--ease), opacity .2s; }
.btn:hover { transform: none; filter: none; background: var(--panel3); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--onink); border-color: var(--ink); box-shadow: none; }
.btn.primary:hover { background: var(--ink); opacity: .85; }
.btn.armed { background: #d93a3a; border-color: #d93a3a; color: #fff; }
.seg { border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }

.search, .sel { border-radius: 10px; }
.field { border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }

.row { border-radius: 10px; }
.row:hover { background: var(--panel2); border-color: transparent; }
.row.playing { background: var(--panel2); border-color: var(--line); box-shadow: none; }
.rowplay { background: transparent; }
.cov { border-radius: 6px; box-shadow: none; }
.mini { border-radius: 5px; }
.bigcov { border-radius: 10px; box-shadow: 0 24px 50px -28px var(--shadow); }
.chero { align-items: flex-start; gap: 32px; }
.pgrid { gap: 40px 28px; }

.toast { border-radius: 10px; }

.panelbtn { border-radius: 8px; background: var(--panel2); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* Tamed Player: music organizer, CD drafts and a concept streaming player. Vanilla JS, no build. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
const andList = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1];
const AUD = /\.(mp3|wav|m4a|aac|flac|ogg|opus|aif|aiff)$/i;
const cover = (a, b) => { const l1 = 30 + (a % 45), l2 = 8 + (b % 22); return `background:linear-gradient(135deg,hsl(0 0% ${l1}%),hsl(0 0% ${l2}%))`; };
const gray = (a, b) => [`hsl(0 0% ${30 + (a % 45)}%)`, `hsl(0 0% ${8 + (b % 22)}%)`];
const ST = { demo: 'Demo', unmixed: 'Unmixed', final: 'Final' };
const KINDS = { album: 'Album', ep: 'EP', mixtape: 'Mixtape', single: 'Single' };
const VIZ = { off: 'Off', bars: 'Bars', wave: 'Wave', orb: 'Orb', pulse: 'Pulse' };
const EQF = [60, 230, 910, 3600, 14000], EQL = ['60', '230', '910', '3.6k', '14k'];
const EQP = { flat: ['Flat', [0, 0, 0, 0, 0]], bass: ['Bass boost', [6, 3, 0, 0, 1]], vocal: ['Vocal', [-2, -1, 3, 4, 1]], bright: ['Bright', [-1, 0, 1, 3, 5]], night: ['Late night', [3, 1, -1, -3, -4]], car: ['Car', [5, 2, -1, 2, 3]] };
const IC = {
  play: 'M8 5v14l11-7z', pause: 'M7 5h4v14H7zM13 5h4v14h-4z', next: 'M6 5l9 7-9 7zM17 5h2v14h-2z', prev: 'M18 5l-9 7 9 7zM5 5h2v14H5z',
  shuffle: 'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5', repeat: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
  plus: 'M12 5v14M5 12h14', minus: 'M5 12h14', upload: 'M12 16V4M7 9l5-5 5 5M4 20h16', search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  dots: 'M5 12h.01M12 12h.01M19 12h.01', heart: 'M12 20.5s-8-4.8-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 3c0 5.7-8 10.5-8 10.5z',
  chevL: 'M15 18l-6-6 6-6', chevR: 'M9 6l6 6-6 6', chevD: 'M6 9l6 6 6-6', up: 'M6 15l6-6 6 6', share: 'M12 3v12M7 8l5-5 5 5M5 14v6h14v-6',
  trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13', link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
  vol: 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6', x: 'M6 6l12 12M18 6 6 18', music: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
  phone: 'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2', list: 'M4 6h16M4 12h16M4 18h10',
  check: 'M5 12l5 5 9-10', quote: 'M4 5h16v11H9l-5 4z', home: 'M4 11l8-7 8 7v9H4z', grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  time: 'M3 12h18M7 8v8M12 6v12M17 9v6', disc: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  eq: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  mail: 'M3 6h18v12H3zM3 6l9 7 9-7', pen: 'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', mic: 'M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM6 11a6 6 0 0 0 12 0M12 17v4',
  import: 'M12 3v12M7 10l5 5 5-5M4 21h16', grip: 'M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01', image: 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M15 9h.01',
  save: 'M12 4v11M7 10l5 5 5-5M5 20h14', lib: 'M4 4v16M9 4v16M14 4l5 16'
};
const FILLED = new Set(['play', 'pause', 'next', 'prev']);
const ico = (n, sz = 18) => `<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${FILLED.has(n) ? 'currentColor' : 'none'}" stroke="${FILLED.has(n) ? 'none' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

/* logo: a plain CD */
const logo = (sz, cls = '') => `<svg class="logo ${cls}" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="cdsil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f6f8"/><stop offset=".45" stop-color="#c3c3ca"/><stop offset=".55" stop-color="#d9d9de"/><stop offset="1" stop-color="#eeeef1"/></linearGradient><mask id="cdhole"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="7.5" fill="#000"/></mask></defs><g mask="url(#cdhole)"><circle cx="50" cy="50" r="48" fill="url(#cdsil)"/><circle cx="50" cy="50" r="17" fill="#ffffff" fill-opacity=".55"/><circle cx="50" cy="50" r="17" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="1.2"/></g><circle cx="50" cy="50" r="47.5" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1"/><circle cx="50" cy="50" r="7.5" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1"/></svg>`;

/* ---------- state ---------- */
const KEY = 'glassroom.v2';
const srcs = {};
let S = {
  tracks: [], cols: [], view: 'library', libTab: 'projects', colId: null, filter: 'all', sort: 'added', q: '',
  cur: null, playing: false, queue: [], rep: false, vol: 0.8, editId: null,
  concept: { skin: 'sp', colId: null, artist: 'Artist Name', verified: false, lyrics: false },
  tl: { items: [], eras: [], showEras: false, zoom: 3 },
  eq: { on: false, preset: 'flat', g: [0, 0, 0, 0, 0] },
  cd: { colId: null, style: 'burn', label: '', skip: [] },
  cx: { open: false, page: 'album', colId: null }
};
let UI = { modal: null, eqOpen: false };
const trk = id => S.tracks.find(t => t.id === id);
const col = id => S.cols.find(c => c.id === id);
const coverObj = c => c && c.covers && c.covers.find(x => x.id === c.cover);
const artOf = c => { const cv = coverObj(c); return cv && srcs['art:' + cv.id]; };
const pcov = c => artOf(c) ? `background:url(${artOf(c)}) center/cover` : cover(c.h1, c.h2);
const ownerCol = t => S.cols.find(c => artOf(c) && c.tracks.includes(t.id));
const tcov = t => { const p = ownerCol(t); return p ? pcov(p) : cover(t.h1, t.h2); };
const pcolors = c => { const cv = coverObj(c); return cv && cv.colors && artOf(c) ? cv.colors : gray(c.h1, c.h2); };
const pgrad = c => { const k = pcolors(c); return `linear-gradient(135deg, ${k.join(', ')})`; };
const feats = t => (t.features || []).map(s => s.trim()).filter(Boolean);
const dispTitle = t => t.title + (t.featInTitle && feats(t).length ? ` (feat. ${andList(feats(t))})` : '');
const artistOf = () => (S.concept.artist || '').trim() || 'Artist Name';
const projOf = t => S.cols.find(c => c.tracks.includes(t.id));
const projArtists = c => (c && Array.isArray(c.artists) && c.artists.filter(Boolean).length ? c.artists.filter(Boolean) : [artistOf()]);
const projArtist = c => projArtists(c).join(', ');
const dispArtist = t => [t.artist || projArtist(projOf(t)), ...feats(t)].filter(Boolean).join(', ');
const ROLES = ['Producer', 'Co-producer', 'Executive producer', 'Songwriter', 'Composer', 'Lyricist', 'Vocals', 'Background vocals', 'Mixing engineer', 'Mastering engineer', 'Recording engineer', 'Guitar', 'Bass', 'Keys', 'Drums', 'Programming', 'Arranger', 'Artwork', 'Label', 'Publisher'];
const creditLine = t => { const g = {}; (t.credits || []).forEach(c => { if (c.role && c.name) (g[c.role] = g[c.role] || []).push(c.name); }); return Object.entries(g).map(([r, n]) => `${r}: ${n.join(', ')}`).join(' · '); };
const save = () => { if (typeof cdTrack === 'function') cdTrack(); try { localStorage.setItem(KEY, JSON.stringify({ ...S, playing: false, q: '', editId: null, cx: { ...S.cx, open: false } })); } catch (e) { } };

function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.tracks) S = { ...S, ...r, playing: false, concept: { ...S.concept, ...r.concept } }; } catch (e) { }
  normalize();
}
function normalize() {
  const now = Date.now();
  S.tracks.forEach(t => {
    if (t.status === 'wip' || t.status === 'mix') t.status = 'unmixed';
    if (!ST[t.status]) t.status = 'demo';
    if (!Array.isArray(t.features)) t.features = []; if (!Array.isArray(t.versions)) t.versions = [];
    t.featInTitle = !!t.featInTitle; if (!t.ver) t.ver = t.id;
  });
  S.cols.forEach((c, i) => {
    delete c.era; if (!/^\d{4}-\d{2}-\d{2}$/.test(c.targetDate || '')) c.targetDate = null;
    if (!Array.isArray(c.covers)) { c.covers = c.art ? [{ id: c.id, colors: null }] : []; c.cover = c.art ? c.id : null; }
    delete c.art;
    if (!Array.isArray(c.tags)) c.tags = []; c.viz = VIZ[c.viz] ? c.viz : 'bars';
    c.created = c.created || now - (S.cols.length - i) * 60000; c.vis = c.vis || 'private'; c.desc = c.desc || '';
    if (!KINDS[c.type]) c.type = 'album';
  });
  if (S.tl && Array.isArray(S.tl.items)) S.tl.items.forEach(i => { const c = i.kind === 'release' && col(i.colId); if (c && i.date && !c.targetDate) c.targetDate = i.date; });
  delete S.tl;
  S.eq = { on: false, preset: 'flat', g: [0, 0, 0, 0, 0], ...(S.eq || {}) };
  S.cd = { colId: null, view: '3d', sheet: 'front', caseType: 'jewel', tray: 'clear', mode: 'orbit', open: false, discOut: false, designs: {}, ...(S.cd || {}) };
  delete S.cd.style; delete S.cd.label; delete S.cd.skip;
  S.tracks.forEach(t => { if (t.artist === 'Artist Name') t.artist = ''; });
  S.cx = { open: false, page: 'album', colId: null, ...(S.cx || {}), open: false };
  if (!['library', 'collection', 'cd', 'concept'].includes(S.view)) S.view = 'library';
  if (!['projects', 'tracks'].includes(S.libTab)) S.libTab = 'projects';
  if (!['tracks', 'cd'].includes(S.projTab)) S.projTab = 'tracks';
  if (S.filter !== 'all' && !ST[S.filter]) S.filter = 'all';
}

/* ---------- file storage (IndexedDB) ---------- */
const DB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('glassroom', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(id, blob) { try { const d = await this.open(); return await new Promise((res, rej) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { return null; } },
  async get(id) { try { const d = await this.open(); return await new Promise((res, rej) => { const q = d.transaction('files').objectStore('files').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } },
  async del(id) { try { const d = await this.open(); d.transaction('files', 'readwrite').objectStore('files').delete(id); } catch (e) { } }
};

/* ---------- audio engine + EQ + analyser ---------- */
const audio = new Audio(); audio.preload = 'auto';
audio.addEventListener('ended', () => onEnd());
audio.addEventListener('error', () => { if (audio.src) toast('That file could not be played'); });
let AC = null, filters = [], analyser = null, freq = null, wave = null;
function ensureGraph() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const src = AC.createMediaElementSource(audio);
    filters = EQF.map((f, i) => { const b = AC.createBiquadFilter(); b.type = i === 0 ? 'lowshelf' : i === 4 ? 'highshelf' : 'peaking'; b.frequency.value = f; b.Q.value = 1.1; return b; });
    analyser = AC.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .78;
    freq = new Uint8Array(analyser.frequencyBinCount); wave = new Uint8Array(analyser.fftSize);
    let n = src; filters.forEach(f => { n.connect(f); n = f; }); n.connect(analyser); analyser.connect(AC.destination);
    applyEq();
  } catch (e) { AC = null; }
}
function applyEq() { filters.forEach((f, i) => { const v = S.eq.on ? S.eq.g[i] : 0; f.gain.setTargetAtTime(v, AC.currentTime, .05); }); }
const verSrc = t => srcs[t.ver] || srcs[t.id] || '';
const verDur = t => { const v = t.versions.find(x => x.id === t.ver); return v ? v.dur : t.dur; };
const Engine = {
  load(t) { audio.pause(); audio.src = verSrc(t); audio.volume = S.vol; },
  play() { ensureGraph(); audio.play().catch(() => toast('Press play again to start audio')); },
  pause() { audio.pause(); },
  pos() { return audio.currentTime || 0; },
  dur() { const t = trk(S.cur); return isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (t ? verDur(t) : 0); },
  seek(x) { audio.currentTime = x; },
  vol(v) { audio.volume = v; }
};
function playTrack(id, queue) {
  const t = trk(id); if (!t) return;
  if (!verSrc(t)) { toast('This track has no audio file yet'); }
  if (queue) S.queue = queue;
  const changed = S.cur !== id; S.cur = id; Engine.load(t); Engine.play(); S.playing = true; refresh(); if (changed) swapAnim();
}
function playQueue(ids, shuffleIt) {
  if (!ids.length) return toast('Nothing to play yet');
  let q = [...ids]; if (shuffleIt) q.sort(() => Math.random() - 0.5);
  playTrack(q[0], q);
}
function toggle() {
  if (!S.cur) { const ids = listIds(); if (ids.length) playQueue(ids); return; }
  if (S.playing) { Engine.pause(); S.playing = false; } else { Engine.play(); S.playing = true; }
  refresh();
}
function step(d) {
  const q = S.queue.length ? S.queue : S.tracks.map(t => t.id);
  let i = q.indexOf(S.cur); if (i < 0) i = 0;
  playTrack(q[(i + d + q.length) % q.length]);
}
function onEnd() { if (S.rep) { Engine.seek(0); Engine.play(); } else step(1); }
function tick() {
  if (!S.cur) return;
  const p = Engine.pos(), d = Engine.dur() || 1, pct = Math.min(100, p / d * 100);
  $$('.js-fill').forEach(e => e.style.width = pct + '%');
  $$('.js-cur').forEach(e => e.textContent = fmt(p));
  $$('.js-rem').forEach(e => e.textContent = '-' + fmt(d - p));
  $$('.js-dur').forEach(e => e.textContent = fmt(d));
  const ly = $$('.js-lyr'); if (ly.length) { const a = Math.min(ly.length - 1, Math.floor(p / d * ly.length)); ly.forEach((e, i) => e.classList.toggle('on', i === a)); }
}
function swapAnim() { const n = $('.bar .now'); if (n) { n.classList.remove('swap'); void n.offsetWidth; n.classList.add('swap'); } }

/* ---------- derived ---------- */
let curListIds = [];
const listIds = () => curListIds.length ? curListIds : S.tracks.map(t => t.id);
function visibleTracks() {
  const q = S.q.toLowerCase();
  let a = S.tracks.filter(t => (S.filter === 'all' || t.status === S.filter) && (!q || (dispTitle(t) + ' ' + dispArtist(t) + ' ' + t.tags + ' ' + t.key).toLowerCase().includes(q)));
  const by = { added: (x, y) => y.added - x.added, title: (x, y) => x.title.localeCompare(y.title), status: (x, y) => Object.keys(ST).indexOf(x.status) - Object.keys(ST).indexOf(y.status), bpm: (x, y) => (x.bpm || 0) - (y.bpm || 0) };
  return a.sort(by[S.sort] || by.added);
}
const colTracks = c => c ? c.tracks.map(trk).filter(Boolean) : [];
const totalSec = a => a.reduce((s, t) => s + verDur(t), 0);
const total = a => { const s = Math.round(totalSec(a)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h} hr ${m} min` : `${m} min ${x} sec`; };
const relDate = c => c.targetDate || null;
function orderedProjects() {
  const has = S.cols.some(c => c.targetDate);
  return [...S.cols].sort((a, b) => {
    if (has) { const da = relDate(a), db = relDate(b); if (da && db && da !== db) return da.localeCompare(db); if (da && !db) return -1; if (db && !da) return 1; }
    return (a.created || 0) - (b.created || 0);
  });
}
const yearOf = c => { const d = relDate(c); return d ? d.slice(0, 4) : new Date(c.created || Date.now()).getFullYear(); };

/* ---------- sliding thumbs ---------- */
const slideMemo = {};
function applySlides() {
  $$('[data-slide]').forEach(box => {
    const th = box.querySelector(':scope > .thumb'); if (!th) return;
    const on = box.querySelector(':scope > .on'), key = box.dataset.slide;
    if (!on || !on.offsetWidth) { th.style.opacity = 0; delete slideMemo[key]; return; }
    const r = { x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight };
    const set = p => { th.style.transform = `translate(${p.x}px,${p.y}px)`; th.style.width = p.w + 'px'; th.style.height = p.h + 'px'; };
    const prev = slideMemo[key];
    if (prev && (prev.x !== r.x || prev.y !== r.y || prev.w !== r.w || prev.h !== r.h)) {
      th.style.transition = 'none'; set(prev); th.style.opacity = 1; void th.offsetWidth; th.style.transition = ''; requestAnimationFrame(() => set(r));
    } else { if (!prev) { th.style.transition = 'none'; set(r); void th.offsetWidth; th.style.transition = ''; } else set(r); th.style.opacity = 1; }
    slideMemo[key] = r;
  });
}
const seg = (key, items, cur, act, extra = '') => `<div class="seg ${extra}" data-slide="${key}" role="group"><i class="thumb"></i>${items.map(([k, l]) => `<button class="${k === cur ? 'on' : ''}" data-act="${act}" data-k="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
const picker = (key, label, opts, cur, act) => `<div class="pick" data-pick="${key}"><button class="pick-btn" data-act="pick" aria-expanded="false"><small>${label}</small><b>${opts[cur]}</b>${ico('chevR', 14)}</button><div class="pick-opts">${Object.entries(opts).map(([k, l], i) => `<button class="${k === cur ? 'on' : ''}" style="--i:${i}" data-act="${act}" data-k="${k}" tabindex="-1">${l}</button>`).join('')}</div></div>`;
function settlePick(el, k) { const p = el.closest('.pick'); if (!p) return; $$('.pick-opts button', p).forEach(b => b.classList.toggle('on', b.dataset.k === k)); $('.pick-btn b', p).textContent = el.textContent; p.classList.remove('open'); $('.pick-btn', p).setAttribute('aria-expanded', 'false'); $$('.pick-opts button', p).forEach(b => b.tabIndex = -1); }

/* ---------- rendering ---------- */
function toast(msg) { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); }

function renderSide() {
  const nav = [['library', 'grid', 'Library', S.cols.length], ['cd', 'disc', 'CD creator'], ['concept', 'phone', 'Concept player']];
  $('#side').innerHTML = `
  <div class="brand">${logo(26)}<span>Tamed Player</span></div>
  <nav class="snav" data-slide="nav"><i class="thumb"></i>${nav.map(([v, i, l, n]) => `<button class="navbtn ${S.view === v ? 'on' : ''}" data-act="nav" data-view="${v}">${ico(i)}<span>${l}</span>${n !== undefined ? `<em>${n}</em>` : ''}</button>`).join('')}</nav>
  <div class="shead"><span>Projects</span><button class="ico" data-act="newcol" aria-label="New project" title="New project">${ico('plus', 16)}</button></div>
  <div class="colswrap"><div class="cols" data-slide="cols"><i class="thumb"></i>${S.cols.map(c => `
    <button class="colitem ${S.view === 'collection' && S.colId === c.id ? 'on' : ''}" data-act="col" data-id="${c.id}" data-drop="${c.id}">
      <span class="mini" style="${pcov(c)}"></span><span class="cn">${esc(c.name)}</span>
    </button>`).join('') || '<p class="faint pad small">No projects yet.</p>'}</div></div>
  <div class="sfoot"><button class="credbtn" data-act="credits" aria-label="Credits" title="Credits">${ico('star', 14)}</button>${window.tpDesktop ? `<button class="credbtn upd" data-act="desk-update" aria-label="Check for updates" title="Version ${esc(tpDesktop.version)}. Check for updates">${ico('save', 14)}</button><span class="ver">v${esc(tpDesktop.version)}</span>` : ''}</div>`;

  return [{ head: 'View only' }, ...(three ? [{ label: S.cd.open ? 'Close Case' : 'Open Case', act: 'cd-open', icon: 'cube' }, { label: S.cd.discOut ? 'Put Disc Back' : 'Remove Disc', act: 'cd-disc', icon: 'disc' }, { label: 'Reset View', act: 'cd-resetview', icon: 'repeat' }, { label: 'Open Viewer', act: 'vw-open-case', icon: 'cube' }] : [{ label: 'Fit on Screen', act: 'cd-zoom', k: 'fit', icon: 'expand' }]), { sep: 1 }, { label: 'Turn Editing On', act: 'cd-lock', icon: 'unlock' }];
}
function trackMenu(t, inCol) {
  const on = S.cur === t.id && S.playing;
  return [{ head: dispTitle(t) }, { label: on ? 'Pause' : 'Play', act: 'play', id: t.id, icon: on ? 'pause' : 'play' }, { sep: 1 },
    { label: 'Rename…', act: 'meta-open', id: t.id, icon: 'type' }, { label: 'Metadata & Credits…', act: 'meta-open', id: t.id, icon: 'list' }, { label: 'Edit Track…', act: 'edit', id: t.id, icon: 'edit' }, { sep: 1 },
    ...Object.entries(ST).map(([k, l]) => ({ label: 'Mark as ' + l, act: 'set-st', id: t.id, k, icon: t.status === k ? 'check' : null })), { sep: 1 },
    ...(inCol ? [{ label: 'Remove from Project', act: 'rm', id: t.id, icon: 'x' }] : []),
    { label: 'Delete Track', act: 'ctx-deltrack', id: t.id, icon: 'trash', danger: 1, confirm: 'Click again to delete' }];
}
function projectMenu(c) {
  return [{ head: c.name + ' · ' + projArtist(c) }, { label: 'Open', act: 'col', id: c.id, icon: 'grid' }, { label: 'Play', act: 'play-col', id: c.id, icon: 'play' }, { sep: 1 },
    { label: 'Rename…', act: 'proj-edit', id: c.id, icon: 'type' }, { label: 'Edit Details & Artists…', act: 'proj-edit', id: c.id, icon: 'edit' }, { sep: 1 }, { label: 'Concept Player', act: 'to-concept', id: c.id, icon: 'phone' },
    { label: 'View CD', act: 'ctx-viewcd', id: c.id, icon: 'disc' }, { label: 'Edit CD', act: 'ctx-editcd', id: c.id, icon: 'edit' }, { label: 'Download Project', act: 'ctx-dlproj', id: c.id, icon: 'save' }, { sep: 1 },
    { label: 'Delete Project', act: 'ctx-delcol', id: c.id, icon: 'trash', danger: 1, confirm: 'Click again to delete' }];
}
function onContext(e) {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  const t = e.target; let menu = null;
  if (t.id === 'cd2d') {
    const r = t.getBoundingClientRect(), p = UI.p2d, key = S.cd.sheet, mx = (e.clientX - r.left) / p - BLEED, my = (e.clientY - r.top) / p - BLEED;
    if (S.cd.lock) menu = viewOnlyMenu(); else { const L = hitLayer(design(cdCol())[key], mx, my); if (L) { UI.cdSel = { sheet: key, id: L.id }; renderCdPanel(); draw2D(); menu = layerMenu(L); } else menu = panelMenu(key, { x: mx, y: my }); }
  } else if (t.classList && t.classList.contains('cd3d') && !UI.vw) {
    if (S.cd.lock) menu = viewOnlyMenu(); else { const h = pick(e); if (h) { const L = hitLayer(design(cdCol())[h.sheet], h.x, h.y); S.cd.sheet = h.sheet; UI.cdSel = { sheet: h.sheet, id: L ? L.id : null }; renderCdPanel(); menu = L ? layerMenu(L) : panelMenu(h.sheet, h); } else menu = panelMenu(S.cd.sheet); }
  } else if (t.closest('[data-psl]')) {
    const f = findLayer(t.closest('[data-psl]').dataset.psl); if (f) { S.cd.sheet = f.sheet; UI.cdSel = { sheet: f.sheet, id: f.L.id }; renderCdPanel(); cdDirty(); menu = layerMenu(f.L); }
  } else if (t.closest('.psg-h, .psbg')) { const k = (t.closest('.psg-h') || t.closest('.psbg').querySelector('[data-k]')).dataset.k; menu = panelMenu(k); }
  else if (t.closest('.ps-canvas, .ps-scroll')) menu = S.cd.lock ? viewOnlyMenu() : panelMenu(S.cd.sheet);
  else if (t.closest('#list .row')) { const r = t.closest('.row'), tr = trk(r.dataset.id); if (tr) menu = trackMenu(tr, r.dataset.row === 'col'); }
  else if (t.closest('.chero') && S.view === 'collection') { const c = col(S.colId); if (c) menu = projectMenu(c); }
  else if (t.closest('.pcard:not(.pc-new), .colitem, .lcard')) { const n = t.closest('.pcard, .colitem, .lcard'), id = (n.dataset.id || (n.querySelector('[data-id]') || {}).dataset?.id); const c = col(id); if (c) menu = projectMenu(c); }
  if (!menu) return;
  e.preventDefault(); ctxMenu(e.clientX, e.clientY, menu);
}
document.addEventListener('contextmenu', onContext);
document.addEventListener('scroll', closeCtx, true);
addEventListener('blur', closeCtx); addEventListener('resize', closeCtx);

/* ---------- boot ---------- */
(async function boot() {
  load();
  for (const t of S.tracks) { if (t.file) { const b = await DB.get(t.id); if (b) srcs[t.id] = URL.createObjectURL(b); else t.file = false; } for (const v of t.versions) { const b = await DB.get(v.id); if (b) srcs[v.id] = URL.createObjectURL(b); } if (t.ver !== t.id && !srcs[t.ver]) t.ver = t.id; }
  for (const c of S.cols) for (const cv of c.covers) { const b = await DB.get('art:' + cv.id); if (b) { srcs['art:' + cv.id] = URL.createObjectURL(b); if (!cv.colors) cv.colors = await extractColors(srcs['art:' + cv.id]); } }
  await loadCustomFonts();
  for (const dd of Object.values(S.cd.designs || {})) for (const sd of Object.values(dd)) for (const l of (sd.layers || [])) if (l.src && l.src.startsWith('cdimg:') && !srcs[l.src]) { const b = await DB.get(l.src); if (b) srcs[l.src] = URL.createObjectURL(b); }
  S.cols.forEach(c => { c.covers = c.covers.filter(cv => srcs['art:' + cv.id]); if (!c.covers.some(cv => cv.id === c.cover)) c.cover = c.covers.length ? c.covers[0].id : null; });
  if (S.cur && !trk(S.cur)) S.cur = null;
  if (S.cur) Engine.load(trk(S.cur));
  if (S.view === 'collection' && !col(S.colId)) S.view = 'library';
  refresh(); renderEq();
  setInterval(tick, 250);
})();
</script>
